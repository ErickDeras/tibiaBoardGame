services:
  - type: web
    name: tibia-boardgame-backend
    runtime: node
    buildCommand: npm --prefix backend ci && npm --prefix backend run prisma:generate && npm --prefix backend run build
    startCommand: npm --prefix backend exec prisma db push && npm --prefix backend run start
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: PORT
        value: "10000"
    disk:
      name: tibia-boardgame-data
      mountPath: /var/data
      sizeGB: 1

  - type: static
    name: tibia-boardgame-frontend
    buildCommand: npm run render:build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
